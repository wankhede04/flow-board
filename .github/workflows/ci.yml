name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Never connected to during build — prisma generate only parses it.
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64 only on PR for speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: flowboard:ci
          cache-from: type=gha,scope=flowboard
          cache-to: type=gha,mode=max,scope=flowboard

      - name: Smoke test runtime container
        run: |
          # --network host: the postgres service container is bound to the
          # runner's own localhost, so the app container joins that network
          # directly to reach it (simplest option for an ephemeral CI smoke test).
          docker run --rm -d \
            --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres" \
            -e JWT_SECRET="ci-secret" \
            --name fb-ci flowboard:ci
          # wait for healthz to come up (max 60s)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/healthz >/dev/null 2>&1; then
              echo "ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/healthz
          curl -fsS http://localhost:3000/api/readyz
          docker logs fb-ci | tail -50
          docker stop fb-ci
